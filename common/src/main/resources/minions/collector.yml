name: "<#FFEE00>Collector <white>Minion"

# The name above the minion. Placeholders: <level>, <level_color>, <owner> and <charge_time>, the time left of the charge (see charge.hologram in the messages.yml), which is empty if charge is not enabled in the config.yml
entity:
  name: "<level_color>[<level>] <#FFEE00>Collector <white>Minion <gray>[<owner>]<charge_time>"

tool:
  material:
    - "WOODEN_SHOVEL"
    - "STONE_SHOVEL"
    - "GOLDEN_SHOVEL"
    - "IRON_SHOVEL"
    - "DIAMOND_SHOVEL"
    - "NETHERITE_SHOVEL"

# Only the items of these types are picked up (Bukkit Material names, case-insensitive), the rest stay where they are.
# If the list is empty, the minion picks up every item. For example:
# whitelist:
#   - "diamond"
#   - "emerald"
whitelist: []

# The ModelEngine model of this minion (the ModelEngine plugin has to be installed), leave it empty to keep the armor stand.
# It is the id of the model, which is the name of its .bbmodel file. The model replaces the armor stand with its armor and tool,
# and the minion is clicked as always. A level can have a model of its own with 'model' in its upgrades, and keeps the model
# of the level before it otherwise. /axminions reload gives the minions the models that are set now.
model: ""
# How big the model is compared to how it was made
model-scale: 1.0
# The animations are the ones of the model in Blockbench (Animate tab), the name has to be the same, upper and lower case letters count.
# The animation that plays while the minion has nothing to do, it should loop (Loop Mode: Loop in Blockbench)
model-idle-animation: "idle"
# The animation for the movement of the arm, which plays every time the minion does its job, on top of the idle one.
# It should not loop (Loop Mode: Once). If both move the same bone, the Override setting of the animation decides which one is seen
model-animation: "work"

# The worlds where this minion can't be placed (not case-sensitive), on top of 'disabled-worlds' in the config.yml.
# Minions that are already in these worlds keep working.
disabled-worlds: []

item:
  type: "player_head"
  texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvN2UzZDM2MzVjZTQxMWFiZjFlNGYzNzNkMTYxZDA3YjhjNDdlMzU5YjZjNTZmNzRiNDEzY2I0OTRhYzc0NmUyZCJ9fX0="
  name: "<#FFEE00>Collector <white>Minion"
  lore:
    - ""
    - " <gray>- <white>Collects all items around itself."
    - ""
    - "<#FFEE00>Statistics"
    - " <#FFEE00>❙ <white>Level: <#FFEEAA><level>"
    - " <#FFEE00>❙ <white>Items collected: <#FFEEAA><actions>"
    - ""
    - "<#FFEE00><b>(!)</b> Place the minion and give it a shovel!"

gui:
  upgrade:
    type: "gold_ingot"
    name: "<#00CCFF><b>Upgrade minion"
    lore:
      - ""
      - " <gray>- <white>Level: <green><level> » <dark_green><next_level>"
      - " <gray>- <white>Range: <green><range> » <dark_green><next_range>"
      - " <gray>- <white>Speed: <green><speed> » <dark_green><next_speed>"
      - " <gray>- <white>Containers: <green><containers> » <dark_green><next_containers>"
      - ""
      - "<#00CCFF>Requirements:"
      - " <gray>- <white>Money: <#33FF33><price>$"
      - " <gray>- <white>Collected items: <#33FF33><required_actions>"
      - ""
      - "<#00CCFF><b>(!)</b> Click here to upgrade your minion!"
  statistics:
    type: "paper"
    name: "<#FFEE00><b>Statistics"
    lore:
      - ""
      - " <gray>- <white>Items collected: <#FFEE00><actions>"
      - ""

